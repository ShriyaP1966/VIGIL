services:
  - type: web
    name: vigil-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_MODE
        value: offline
      - key: DATABASE_URL
        value: sqlite:///./vigil.db
      - key: T_CANDIDATE
        value: "0.75"
      - key: LOG_LEVEL
        value: INFO
